# Candidate only. Install in nginx http context after approval and nginx -t.
log_format isucon_measurement escape=json
  '{"time":"$time_iso8601","msec":$msec,'
  '"method":"$request_method","uri":"$uri","status":$status,'
  '"body_bytes":$body_bytes_sent,"request_time":$request_time,'
  '"upstream_response_time":"$upstream_response_time"}';
# Candidate nginx.conf installs this format before the http-level access_log.
# No request bodies, headers, cookies or query strings are recorded here.
